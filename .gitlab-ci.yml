    - cd build
    #- sims -vlt_build $VLT_BUILD_FLAGS -x_tiles=1 -y_tiles=1 -lox -config_rtl=OX_EXCLUDE_VPU -build_id=lox_vlt_1_1
    - sims -msm_build $MSM_BUILD_FLAGS -x_tiles=1 -y_tiles=1 -lox -config_rtl=OX_EXCLUDE_VPU -build_id=lox_msm_1_1
    #- sims -vlt_build $VLT_BUILD_FLAGS -x_tiles=1 -y_tiles=2 -lox -config_rtl=OX_EXCLUDE_VPU -build_id=lox_vlt_1_2
