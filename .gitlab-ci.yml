################################################################################
# ARIANE (w/ HPDC)
################################################################################

ariane_hpdc_build:
  stage: build
  rules:
    !reference [.rules_default]
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    CI_TAGS: non_resources
  before_script:
    - !reference [.ariane_hpdc_regression_base, before_script]
  script:
    - piton/ariane_build_tools.sh $CI_JOB_TOKEN
    - cd build
