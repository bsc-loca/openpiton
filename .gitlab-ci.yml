  rules:
    !reference [.rule_only_merge]
  needs: [ariane_hpdc_build, ariane_hpdc_benchmarks]
  parallel:
    matrix:
      - X_TILES: [1,2]
        Y_TILES: [2]
        SIM_TYPE: vlt
        CI_TAGS: non_resources
      - X_TILES: [1,2]
        Y_TILES: [2]
        SIM_TYPE: msm
  script:
    - cd build
    - sims -sim_type=$SIM_TYPE $SIMS_FLAGS -build_id=ariane_hpdc_${SIM_TYPE}_${X_TILES}_${Y_TILES}
      -group ariane_tile$(($X_TILES * $Y_TILES))_simple
      -group ariane_tile$(($X_TILES * $Y_TILES))_mt_benchmarks
    - !reference [.regression_report, script]
  artifacts:
    expire_in: 1 day
    when: always
    paths:
      - ./build

################################################################################
# Linting
################################################################################

linting_check:
  stage: linting
  needs: [lox_build]
  extends: .vc_base
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  before_script:
    - export SNPS_LICENSE_FILE=27020@epi01.bsc.es
    - export SNPSLMD_LICENSE_FILE=27020@epi01.bsc.es
    - export LM_LICENSE_FILE=$LM_LICENSE_FILE:$SNPS_LICENSE_FILE:$SNPSLMD_LICENSE_FILE
    - export SNPSLMD_QUEUE=true
    - source /eda/synopsys/synopsys.sh
    - source piton/lox_setup.sh
  script:
    - cd linting_scripts
    - make FLIST=../build/hpc/lox_msm_1_1/flist VC_REL
  artifacts:
    expire_in: 1 day
    when: always
    paths:
      - ./linting_scripts/report


################################################################################
# DC elaboration
################################################################################

sarg_DC_elab:
  stage: linting
  needs: [sargantana_elab_build]
  extends: .vc_base
  before_script:
    - export SNPS_LICENSE_FILE=27020@epi01.bsc.es
    - export SNPSLMD_LICENSE_FILE=27020@epi01.bsc.es
    - export LM_LICENSE_FILE=$LM_LICENSE_FILE:$SNPS_LICENSE_FILE:$SNPSLMD_LICENSE_FILE
    - export SNPSLMD_QUEUE=true
    - export RISCV=/opt/riscv-gnu-toolchain/rvv-1.0.0/
    - source /eda/synopsys/synopsys.sh
    - source piton/sargantana_setup.sh
  script:
    - cd build; 
    - asic_synth $ASIC_FLAGS -asic_skip_rtl_gen -asic_elaborate_only
  artifacts:
    expire_in: 1 day
    when: always
    paths:
      - ./build



