################################################################################
# ARIANE
################################################################################

ariane_build:
  stage: build
  rules:
    !reference [.rules_default]
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    CI_TAGS: non_resources
  before_script:
    - !reference [.ariane_regression_base, before_script]
  script:
    - piton/ariane_build_tools.sh $CI_JOB_TOKEN
    - cd build
    - sims -vlt_build $VLT_BUILD_FLAGS -x_tiles=1 -y_tiles=1 -ariane -build_id=ariane_vlt_1_1
    - sims -msm_build $MSM_BUILD_FLAGS -x_tiles=1 -y_tiles=1 -ariane -build_id=ariane_msm_1_1
    - sims -vlt_build $VLT_BUILD_FLAGS -x_tiles=1 -y_tiles=2 -ariane -build_id=ariane_vlt_1_2
    - sims -msm_build $MSM_BUILD_FLAGS -x_tiles=1 -y_tiles=2 -ariane -build_id=ariane_msm_1_2
    - sims -vlt_build $VLT_BUILD_FLAGS -x_tiles=2 -y_tiles=2 -ariane -build_id=ariane_vlt_2_2
    - sims -msm_build $MSM_BUILD_FLAGS -x_tiles=2 -y_tiles=2 -ariane -build_id=ariane_msm_2_2
    - sims -msm_build $MSM_BUILD_FLAGS -x_tiles=2 -y_tiles=2 -ariane -build_id=ariane_msm_2_2_mmc_real -multimc=2 -multimc_indices=0,3 -hbm -hbm_lat=tools/pli/Realistic_lat/curves_src/cxl.zip
    - sims -vlt_build $MSM_BUILD_FLAGS -x_tiles=2 -y_tiles=2 -ariane -build_id=ariane_vlt_2_2_mmc_real -multimc=2 -multimc_indices=0,3 -hbm -hbm_lat=tools/pli/Realistic_lat/curves_src/cxl.zip
    - sims -msm_build $MSM_BUILD_FLAGS -x_tiles=2 -y_tiles=2 -ariane -build_id=ariane_msm_2_2_mmc_fix  -multimc=2 -multimc_indices=1,2 -hbm -hbm_lat=100 -pronoc
    - sims -vlt_build $MSM_BUILD_FLAGS -x_tiles=2 -y_tiles=2 -ariane -build_id=ariane_vlt_2_2_mmc_fix  -multimc=2 -multimc_indices=1,2 -hbm -hbm_lat=100 -pronoc   
